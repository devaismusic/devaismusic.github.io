<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DÈVA — Links</title>
  <meta name="description" content="Contemporary jazz quartet exploring electronic landscapes">
  <meta property="og:title" content="DÈVA">
  <meta property="og:description" content="Contemporary jazz quartet exploring electronic landscapes">
  <meta property="og:image" content="avatar.jpg">
  <link rel="icon" href="avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d12;
      --text: #f2efe9;
      --muted: #a9a4b5;
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #041A54;
    }
    @font-face {
  font-family: stamp; /* set name */
  src: url(Stamp.ttf); /* url of the font */
}
   @font-face {
  font-family: denim; /* set name */
  src: url(DenimTRIALVF.ttf); /* url of the font */
}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "denim", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 56px 20px 40px;
      overflow-x: hidden;
    }
    /* sfondo animato morbido */
    .bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
    }
    .bg span {
      position: absolute; border-radius: 50%; filter: blur(90px); opacity: .45;
      animation: float 22s ease-in-out infinite alternate;
    }
    .bg span:nth-child(1) { width: 420px; height: 420px; background: #041A54; top: -120px; left: -100px; }
    .bg span:nth-child(2) { width: 360px; height: 360px; background: lightblue; bottom: -120px; right: -80px; animation-delay: -8s; }
    .bg span:nth-child(3) { width: 300px; height: 300px; background: lightgrey; top: 40%; left: 55%; animation-delay: -14s; }
    @keyframes float {
      to { transform: translate(60px, 40px) scale(1.15); }
    }

    main { width: 100%; max-width: 560px; text-align: center; }

    .avatar {
      width: 112px; height: 112px; border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    h1 {
      font-family: "stamp", serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: .12em;
      margin-top: 18px;
    }
    .bio {
      color: var(--muted);
      font-size: .98rem;
      margin-top: 8px;
      line-height: 1.5;
    }

    .socials {
      display: flex; justify-content: center; gap: 14px; margin-top: 18px;
    }
    .socials a {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: 50%;
      color: var(--text);
      transition: color .2s, transform .2s;
    }
    .socials a:hover { color: var(--accent); transform: translateY(-2px); }
    .socials svg { width: 24px; height: 24px; }

    .links { list-style: none; margin-top: 32px; display: grid; gap: 14px; }
    .links a {
      
      font-family: 'stamp';
      display: block;
      padding: 18px 22px;
      /* border-radius: 14px; */
      /* background: lightgrey; */
      border-top: 3px solid var(--muted);
      /* backdrop-filter: blur(10px); */
      -webkit-backdrop-filter: blur(10px);
      color: var(--muted);
      text-decoration: none;
      /* font-weight: 500; */
      font-size: 2.02rem;
      transition: background .2s, transform .2s, border-color .2s;
      }
    .links a:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .links small {
      display: block;
      color: var(--accent);
      font-weight: 400;
      font-size: 0.72rem;
      margin-top: 3px;
      font-family: 'denim';
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: var(--muted);
      padding: 0.5rem;
      border-radius: 1rem;

    }
    .links a.release {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px 10px 10px;
  text-align: left;
}
.links .cover {
  width: 56px;
  height: 56px;
  border-radius: 0px;
  object-fit: cover;
  flex-shrink: 0;
}

    footer {
      margin-top: 48px; color: var(--muted); font-size: .8rem; opacity: .7;
    }

    main > * { animation: in .6s ease both; }
    .links li { animation: in .6s ease both; }
    .links li:nth-child(1) { animation-delay: .15s; }
    .links li:nth-child(2) { animation-delay: .25s; }
    .links li:nth-child(3) { animation-delay: .35s; }
    .links li:nth-child(4) { animation-delay: .45s; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } }
    @media (prefers-reduced-motion: reduce) {
      *, .bg span { animation: none !important; }
    }
  </style>
</head>
<body>
  <!---div class="bg" aria-hidden="true"><span></span><span></span><span></span></div--->
  <div class="bg" aria-hidden="true"><img src="sfondo.png" style="max-width: 100vw; object-fit: cover;"></div>

  <main>
    <!-- Metti la tua foto come avatar.jpg nella stessa cartella del repo -->
    <img class="avatar" src="avatar.jpg" alt="DÈVA"
         onerror="this.onerror=null;this.src='https://ugc.production.linktr.ee/045eb4ad-93e1-4126-9a94-bd000deb2721_GIU-2903-Modifica.jpeg?io=true&size=avatar-v3_0';">

    <h1>DÈVA</h1>
    <p class="bio">Contemporary jazz quartet exploring electronic landscapes</p>

    

    <!-- Per aggiungere un link, copia un <li> e cambia testo e href -->
    <ul class="links">
      <li>
        <a class="release" href="https://music.imusician.pro/a/JR8baynw" target="_blank" rel="noopener">
          <img class="cover" src="deva.jpg" alt="Copertina DÈVA" loading="lazy">
          <span>DÈVA (EP)</span><small>Ascolta ora</small>
        </a>
      </li>
      <li>
        <a class="release" href="https://music.imusician.pro/a/yZEC7jmq" target="_blank" rel="noopener">
          <img class="cover" src="drifting.jpg" alt="Copertina Drifting in Tandem" loading="lazy">
          <span>Drifting in Tandem (singolo)</span><small>Ascolta ora</small>
        </a>
      </li>
    </ul>
    <nav class="socials" aria-label="Social">
      <a href="https://www.instagram.com/devaismusic" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>
        </svg>
      </a>
    </nav>
    <footer>© DÈVA</footer>
  </main>
</body>
</html>
